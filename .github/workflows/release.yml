name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version/tag to package, e.g. v0.1.0-doctor.1'
        required: true
        type: string

permissions:
  contents: write

jobs:
  package:
    name: package release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true
      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME}"
          fi
          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9._-]+)?$ ]]; then
            echo "Invalid release version: $version" >&2
            exit 2
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Validate
        run: |
          go test ./...
          go vet ./...
          go mod verify
      - name: Package
        run: ./scripts/package-release.sh "${{ steps.version.outputs.version }}"
      - name: Smoke packaged linux binary
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          tmp=$(mktemp -d)
          tar -xzf "dist/packages/loki_${version}_linux_amd64.tar.gz" -C "$tmp"
          got="$($tmp/loki --version)"
          if [[ "$got" != "$version" ]]; then
            echo "version smoke failed: got $got want $version" >&2
            exit 1
          fi
          "$tmp/loki" doctor --json >/dev/null
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: loki-${{ steps.version.outputs.version }}-packages
          path: dist/packages/*
          if-no-files-found: error
      - name: Create GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          notes=$(mktemp)
          {
            echo "Loki Profile Manager $VERSION"
            echo
            echo "Pre-release binary packages for private dogfood validation."
            echo
            echo "Verify downloads with checksums.txt before running."
          } > "$notes"
          prerelease=()
          if [[ "$VERSION" == *-* ]]; then
            prerelease=(--prerelease)
          fi
          gh release create "$VERSION" dist/packages/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$VERSION" \
            --notes-file "$notes" \
            "${prerelease[@]}"
