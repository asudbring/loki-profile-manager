name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag/version, e.g. v0.1.0'
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_VERSION: ${{ inputs.version || github.ref_name }}

jobs:
  package:
    name: Validate and package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          go test ./...
          go vet ./...
          go mod verify
          go build -trimpath -o "$RUNNER_TEMP/loki" ./cmd/loki
          bash -n scripts/install.sh scripts/uninstall.sh scripts/package-release.sh scripts/package-npm.sh scripts/validate-cross.sh scripts/parallels-windows-admin-probe.sh
          node --check npm/bin/loki.js
          pwsh -NoProfile -Command '
            $allErrors = @()
            foreach ($file in @("scripts/install.ps1", "scripts/uninstall.ps1", "scripts/windows-installer-smoke.ps1", "scripts/validate-local.ps1")) {
              $errors = $null
              $null = [System.Management.Automation.PSParser]::Tokenize((Get-Content -Raw $file), [ref]$errors)
              if ($errors) { $allErrors += $errors }
            }
            if ($allErrors.Count -gt 0) { $allErrors | Format-List *; exit 1 }
          '
      - name: Package release assets
        shell: bash
        run: |
          set -euo pipefail
          scripts/package-release.sh "$RELEASE_VERSION" dist/packages
          scripts/package-npm.sh "$RELEASE_VERSION" dist/packages
      - uses: actions/upload-artifact@v4
        with:
          name: loki-release-packages
          path: dist/packages/*

  installer-smoke:
    name: Installer smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: package
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - uses: actions/download-artifact@v4
        with:
          name: loki-release-packages
          path: packages
      - name: Unix installer smoke
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          chmod +x packages/install.sh packages/uninstall.sh
          goos=$(go env GOOS)
          goarch=$(go env GOARCH)
          archive="$PWD/packages/loki_${RELEASE_VERSION}_${goos}_${goarch}.tar.gz"
          install_dir="$RUNNER_TEMP/loki-bin"
          store="$RUNNER_TEMP/loki-store"
          bash packages/install.sh --version "$RELEASE_VERSION" --archive "$archive" --checksums "$PWD/packages/checksums.txt" --install-dir "$install_dir" --force --store-path "$store"
          "$install_dir/loki" machine register --allow-profile work --active-profile work
          "$install_dir/loki" verify work
          "$install_dir/loki" switch work --dry-run
          bash packages/uninstall.sh --install-dir "$install_dir"
          test ! -e "$install_dir/loki"
          test -d "$store"
      - name: Windows installer smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $assets = (Resolve-Path packages).Path
          $arch = if (($env:PROCESSOR_ARCHITEW6432 -eq 'ARM64') -or ($env:PROCESSOR_ARCHITECTURE -eq 'ARM64')) { 'arm64' } else { 'amd64' }
          $archive = Get-ChildItem -LiteralPath $assets -Filter "loki_${env:RELEASE_VERSION}_windows_${arch}.zip" | Select-Object -First 1
          if (-not $archive) { throw "Windows archive missing for $arch" }
          $installDir = Join-Path $env:RUNNER_TEMP 'Loki'
          ./scripts/windows-installer-smoke.ps1 -Version $env:RELEASE_VERSION -AssetsDir $assets -ArchivePath $archive.FullName -InstallDir $installDir

  npm-smoke:
    name: npm installer smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: package
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/download-artifact@v4
        with:
          name: loki-release-packages
          path: packages
      - name: npm global install smoke
        shell: bash
        run: |
          set -euo pipefail
          package_tgz=$(node -e "const fs=require('fs'),path=require('path'); const dir=path.resolve('packages'); const name=fs.readdirSync(dir).find((entry)=>entry.endsWith('.tgz')); if(!name) process.exit(1); console.log(path.join(dir, name));")
          if [[ -z "$package_tgz" ]]; then
            echo "npm package tarball missing" >&2
            exit 1
          fi
          npm install -g "$package_tgz"
          installed_version=$(loki --version | tr -d '\r')
          if [[ "$installed_version" != "$RELEASE_VERSION" ]]; then
            echo "version mismatch: got $installed_version want $RELEASE_VERSION" >&2
            exit 1
          fi
          store=$(node -e "console.log(require('path').join(require('os').tmpdir(), 'loki-npm-store'))")
          node -e "require('fs').rmSync(process.argv[1], { recursive: true, force: true })" "$store"
          loki --store "$store" store init "$store" >/dev/null
          loki --store "$store" doctor --json >/dev/null
          loki --store "$store" machine register --allow-profile work --active-profile work >/dev/null
          loki --store "$store" verify work >/dev/null
          loki --store "$store" switch work --dry-run >/dev/null
          npm uninstall -g @asudbring/loki-profile-manager
          hash -r
          if command -v loki >/dev/null 2>&1; then
            echo "loki still found after npm uninstall" >&2
            exit 1
          fi

  publish:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: [installer-smoke, npm-smoke]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: loki-release-packages
          path: packages
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/release-notes.md"
          cat > "$notes" <<'NOTES'
          ## Loki Profile Manager __VERSION__

          Private dogfood release.

          ### Install

          npm tarball install:

          ```bash
          npm install -g ./asudbring-loki-profile-manager-__NPM_VERSION__.tgz
          loki --version
          ```

          Windows script install:

          ```powershell
          .\install.ps1 -Version __VERSION__ -ArchivePath .\loki___VERSION___windows_arm64.zip -ChecksumsPath .\checksums.txt -AddToPath
          ```

          macOS/Linux script install:

          ```bash
          ./install.sh --version __VERSION__ --archive ./loki___VERSION___darwin_arm64.tar.gz --checksums ./checksums.txt
          ```

          ### Notes

          - Verify `checksums.txt` before install.
          - npm install/uninstall affects only the npm wrapper and bundled binary; Loki local state and synced stores are preserved.
          - Windows symlink activation requires Developer Mode or elevation.
          - Script uninstall preserves local Loki state, synced stores, and managed targets by default.
          NOTES
          python3 - "$notes" "$RELEASE_VERSION" <<'PY'
          import pathlib
          import sys
          path = pathlib.Path(sys.argv[1])
          version = sys.argv[2]
          npm_version = version[1:] if version.startswith('v') else version
          text = path.read_text(encoding='utf-8')
          text = text.replace('__VERSION__', version).replace('__NPM_VERSION__', npm_version)
          path.write_text(text, encoding='utf-8')
          PY
          if gh release view "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_VERSION" packages/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            prerelease=()
            if [[ "$RELEASE_VERSION" == *-* ]]; then prerelease=(--prerelease); fi
            gh release create "$RELEASE_VERSION" packages/* --repo "$GITHUB_REPOSITORY" --title "$RELEASE_VERSION" --notes-file "$notes" "${prerelease[@]}"
          fi
