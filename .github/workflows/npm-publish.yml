name: Publish npm

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag/version, e.g. v0.1.1'
        required: true
        type: string
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    name: Publish npm package
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ inputs.version || github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version || github.event.release.tag_name }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          go test ./...
          go vet ./...
          go mod verify
          bash -n scripts/install.sh scripts/uninstall.sh scripts/package-release.sh scripts/package-npm.sh scripts/release-local.sh scripts/validate-cross.sh scripts/parallels-windows-admin-probe.sh
          node --check npm/bin/loki.js
          pwsh -NoProfile -Command '
            $allErrors = @()
            foreach ($file in @("scripts/install.ps1", "scripts/uninstall.ps1", "scripts/windows-installer-smoke.ps1", "scripts/validate-local.ps1")) {
              $errors = $null
              $null = [System.Management.Automation.PSParser]::Tokenize((Get-Content -Raw $file), [ref]$errors)
              if ($errors) { $allErrors += $errors }
            }
            if ($allErrors.Count -gt 0) { $allErrors | Format-List *; exit 1 }
          '
      - name: Build npm tarball
        shell: bash
        run: |
          set -euo pipefail
          scripts/package-release.sh "$RELEASE_VERSION" dist/packages
          scripts/package-npm.sh "$RELEASE_VERSION" dist/packages
          if command -v sha256sum >/dev/null 2>&1; then
            (cd dist/packages && sha256sum -c checksums.txt)
          else
            (cd dist/packages && shasum -a 256 -c checksums.txt)
          fi
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${NODE_AUTH_TOKEN:-}" ]]; then
            echo "NPM_TOKEN repository secret is not configured" >&2
            exit 1
          fi
          npm_version="${RELEASE_VERSION#v}"
          package_tgz="./dist/packages/asudbring-loki-profile-manager-${npm_version}.tgz"
          if [[ ! -f "$package_tgz" ]]; then
            echo "npm package tarball missing: $package_tgz" >&2
            exit 1
          fi
          if npm view "@asudbring/loki-profile-manager@${npm_version}" version >/dev/null 2>&1; then
            npm access set status=public @asudbring/loki-profile-manager
            echo "@asudbring/loki-profile-manager@${npm_version} already published; ensured public access"
            exit 0
          fi
          npm publish "$package_tgz" --access public
          npm access set status=public @asudbring/loki-profile-manager
