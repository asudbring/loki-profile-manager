name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Go validation
        shell: bash
        run: |
          set -euo pipefail
          go test ./...
          go vet ./...
          go mod verify
          ext=""
          if [[ "$(go env GOOS)" == "windows" ]]; then ext=".exe"; fi
          go build -trimpath -o "$RUNNER_TEMP/loki${ext}" ./cmd/loki
      - name: Script syntax
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/install.sh scripts/uninstall.sh scripts/package-release.sh scripts/package-npm.sh scripts/validate-cross.sh scripts/parallels-windows-admin-probe.sh
          node --check npm/bin/loki.js
          pwsh -NoProfile -Command '
            $allErrors = @()
            foreach ($file in @("scripts/install.ps1", "scripts/uninstall.ps1", "scripts/windows-installer-smoke.ps1", "scripts/validate-local.ps1")) {
              $errors = $null
              $null = [System.Management.Automation.PSParser]::Tokenize((Get-Content -Raw $file), [ref]$errors)
              if ($errors) { $allErrors += $errors }
            }
            if ($allErrors.Count -gt 0) { $allErrors | Format-List *; exit 1 }
          '

  package:
    name: Package release assets
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build package set
        shell: bash
        run: |
          set -euo pipefail
          scripts/package-release.sh v0.0.0-ci dist/packages
          scripts/package-npm.sh v0.0.0-ci dist/packages
      - uses: actions/upload-artifact@v4
        with:
          name: loki-packages
          path: dist/packages/*

  installer-smoke:
    name: Installer smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: package
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - uses: actions/download-artifact@v4
        with:
          name: loki-packages
          path: packages
      - name: Unix installer smoke
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          chmod +x packages/install.sh packages/uninstall.sh
          goos=$(go env GOOS)
          goarch=$(go env GOARCH)
          archive="$PWD/packages/loki_v0.0.0-ci_${goos}_${goarch}.tar.gz"
          install_dir="$RUNNER_TEMP/loki-bin"
          store="$RUNNER_TEMP/loki-store"
          bash packages/install.sh --version v0.0.0-ci --archive "$archive" --checksums "$PWD/packages/checksums.txt" --install-dir "$install_dir" --force --store-path "$store"
          "$install_dir/loki" machine register --allow-profile work --active-profile work
          "$install_dir/loki" verify work
          "$install_dir/loki" switch work --dry-run
          bash packages/uninstall.sh --install-dir "$install_dir"
          test ! -e "$install_dir/loki"
          test -d "$store"
      - name: Windows installer smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $assets = (Resolve-Path packages).Path
          $arch = if (($env:PROCESSOR_ARCHITEW6432 -eq 'ARM64') -or ($env:PROCESSOR_ARCHITECTURE -eq 'ARM64')) { 'arm64' } else { 'amd64' }
          $archive = Get-ChildItem -LiteralPath $assets -Filter "loki_v0.0.0-ci_windows_${arch}.zip" | Select-Object -First 1
          if (-not $archive) { throw "Windows archive missing for $arch" }
          $installDir = Join-Path $env:RUNNER_TEMP 'Loki'
          ./scripts/windows-installer-smoke.ps1 -Version v0.0.0-ci -AssetsDir $assets -ArchivePath $archive.FullName -InstallDir $installDir

  npm-smoke:
    name: npm installer smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: package
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/download-artifact@v4
        with:
          name: loki-packages
          path: packages
      - name: npm global install smoke
        shell: bash
        run: |
          set -euo pipefail
          package_tgz=$(node -e "const fs=require('fs'),path=require('path'); const dir=path.resolve('packages'); const name=fs.readdirSync(dir).find((entry)=>entry.endsWith('.tgz')); if(!name) process.exit(1); console.log(path.join(dir, name));")
          if [[ -z "$package_tgz" ]]; then
            echo "npm package tarball missing" >&2
            exit 1
          fi
          npm install -g "$package_tgz"
          installed_version=$(loki --version | tr -d '\r')
          if [[ "$installed_version" != "v0.0.0-ci" ]]; then
            echo "version mismatch: got $installed_version" >&2
            exit 1
          fi
          store=$(node -e "console.log(require('path').join(require('os').tmpdir(), 'loki-npm-store'))")
          node -e "require('fs').rmSync(process.argv[1], { recursive: true, force: true })" "$store"
          loki --store "$store" store init "$store" >/dev/null
          loki --store "$store" doctor --json >/dev/null
          loki --store "$store" machine register --allow-profile work --active-profile work >/dev/null
          loki --store "$store" verify work >/dev/null
          loki --store "$store" switch work --dry-run >/dev/null
          npm uninstall -g @asudbring/loki-profile-manager
          hash -r
          if command -v loki >/dev/null 2>&1; then
            echo "loki still found after npm uninstall" >&2
            exit 1
          fi
